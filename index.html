<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnHub | Share & Learn Together</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #4834d4; --secondary: #686de0; --bg: #f4f7fa;
            --card-bg: #ffffff; --text-main: #2d3436; --accent: #22a6b3;
            --shadow: 0 8px 20px rgba(72, 52, 212, 0.1); --danger: #eb4d4b; --success: #6ab04c;
        }

        * { box-sizing: border-box; font-family: 'Mitr', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 10px; min-height: 100vh; }
        .container { max-width: 1100px; margin: auto; }

        /* Login & Header */
        .login-box { background: var(--card-bg); padding: 60px 20px; border-radius: 40px; text-align: center; box-shadow: var(--shadow); margin-top: 10vh; }
        .btn-google { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 16px 40px; border-radius: 50px; font-size: 1.1rem; cursor: pointer; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 12px 20px; border-radius: 20px; box-shadow: var(--shadow); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-info img { width: 35px; border-radius: 50%; border: 2px solid var(--accent); }

        /* Share UI (Importing Bar) */
        #importBar { display: none; background: var(--primary); color: white; padding: 15px; border-radius: 20px; margin-bottom: 20px; text-align: center; animation: slideDown 0.5s ease; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Content Panels */
        .admin-panel, .search-section { background: var(--card-bg); padding: 20px; border-radius: 25px; margin-bottom: 20px; box-shadow: var(--shadow); }
        .search-section { background: #eff2ff; border-left: 5px solid var(--primary); }
        .label { font-size: 0.85rem; color: var(--primary); font-weight: 500; margin-bottom: 8px; display: block; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        input, select { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid #e0e0e0; outline: none; }
        button { padding: 12px 20px; border-radius: 15px; border: none; font-weight: 500; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }

        /* Share Area per Category */
        .category-actions { margin-bottom: 15px; display: flex; gap: 10px; justify-content: center; }

        /* Video Grid */
        .video-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .video-card { background: white; border-radius: 25px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
        .video-title-tab { padding: 12px 18px; background: #fdfdfd; font-size: 0.9rem; font-weight: 500; color: var(--primary); line-height: 1.5; }
        .iframe-wrap { position: relative; padding-top: 56.25%; background: #000; }
        .iframe-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .card-actions { display: flex; justify-content: space-around; padding: 15px; background: #fff; }
        .tool-btn { background: #f8f9fb; padding: 8px 18px; border-radius: 12px; font-size: 0.85rem; color: #636e72; }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); padding: 20px; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; }

        #mainApp, .hidden { display: none; }
        @media (min-width: 768px) { .input-group { flex-direction: row; } .video-grid { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); } }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าต้อนรับสำหรับผู้รับลิงก์แชร์ -->
    <div id="importBar">
        <span id="importText">พบลิสต์บทเรียนที่มีการแชร์มาให้คุณ ✨</span>
        <button class="btn-success" style="margin-left:15px; padding:8px 20px;" onclick="importSharedData()">นำเข้าสู่ LearnHub ของฉัน</button>
    </div>

    <!-- หน้า Login -->
    <div id="loginPage" class="login-box">
        <span style="font-size:4rem;">🎓</span>
        <h1 style="color:var(--primary); margin:0;">LearnHub</h1>
        <p style="margin-bottom:40px; color:#636e72;">“Your personal learning hub.”</p>
        <button class="btn-google" onclick="login()">🚀 เริ่มต้นเรียนรู้</button>
    </div>

    <!-- หน้าแอปหลัก -->
    <div id="mainApp">
        <div class="header">
            <div class="user-info"><img id="userImg" src=""> <span id="userName">My Workspace</span></div>
            <button onclick="auth.signOut()" style="background:none; border:none; color:#b2bec3; cursor:pointer;">Logout</button>
        </div>

        <div class="search-section">
            <span class="label">🔍 ค้นหาความรู้ใหม่</span>
            <div class="input-group">
                <input type="text" id="searchQuery" placeholder="พิมพ์หัวข้อบทเรียน...">
                <button class="btn-accent" onclick="searchYouTube()">ค้นหา</button>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>

        <div class="admin-panel">
            <span class="label">📚 จัดการหมวดหมู่</span>
            <div class="input-group">
                <select id="parentCatSelect"><option value="none">-- เป็นหมวดหลัก --</option></select>
                <input type="text" id="catInput" placeholder="ชื่อหมวดหมู่ใหม่...">
                <button class="btn-primary" onclick="addCategory()">สร้าง</button>
            </div>
        </div>

        <div style="margin-bottom: 20px; text-align: center;">
            <select id="viewFilter" onchange="renderVideos()" style="width:100%; max-width:500px; border-radius:50px; font-weight:bold; color:var(--primary); box-shadow:var(--shadow);">
                <option value="all">💎 คลังความรู้ทั้งหมด</option>
            </select>
            
            <!-- ปุ่มแชร์หมวดหมู่ปัจจุบัน -->
            <div id="shareControl" style="margin-top:15px; display:none;">
                <button class="btn-primary" style="background:var(--accent); font-size:0.85rem;" onclick="generateShareLink()">🔗 แชร์หมวดหมู่นี้ให้เพื่อน</button>
            </div>
        </div>

        <div id="videoDisplay" class="video-grid"></div>
    </div>
</div>

<!-- Modal: บันทึก -->
<div id="saveModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitleText" style="color:var(--primary); font-size:0.95rem; margin-bottom:20px; line-height: 1.5;">บันทึกลงคลัง ✨</h3>
        <select id="modalCatSelect" style="margin-bottom: 25px;"></select>
        <button class="btn-primary" style="width: 100%; margin-bottom: 12px;" onclick="executeQuickSave()">ตกลง</button>
        <button onclick="closeModal('saveModal')" style="width: 100%; background: #f1f2f6; border-radius: 15px; padding:12px; border:none;">ยกเลิก</button>
    </div>
</div>

<script>
    // Config Firebase (ใช้ตัวเดิมของคุณ)
    const YT_API_KEY = "AIzaSyBVsxZxnjoMEE6uCk3qaAoenOLEdbgg3U4";
    const firebaseConfig = {
        apiKey: "AIzaSyDWr7Ev6aPzwNPTfuRYp46Pb_a-uJboiXg",
        authDomain: "video-playlist-40cf0.firebaseapp.com",
        projectId: "video-playlist-40cf0",
        storageBucket: "video-playlist-40cf0.firebasestorage.app",
        messagingSenderId: "128728975658",
        appId: "1:128728975658:web:255d64e66af8ef66c57653",
        databaseURL: "https://video-playlist-40cf0-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let myData = { categories: {}, videos: {} };
    let sharedData = null; // เก็บข้อมูลที่ถูกแชร์มา

    // --- ตรวจสอบ Share Link เมื่อโหลดหน้า ---
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const shareId = urlParams.get('share');
        if (shareId) {
            db.ref('public_shares/' + shareId).once('value', snapshot => {
                if (snapshot.exists()) {
                    sharedData = snapshot.val();
                    document.getElementById('importBar').style.display = 'block';
                    document.getElementById('importText').textContent = `มีบทเรียนเรื่อง "${sharedData.catName}" แชร์มาให้คุณ ✨`;
                }
            });
        }
    };

    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userName').textContent = user.displayName;
            document.getElementById('userImg').src = user.photoURL;
            db.ref('users/' + user.uid).on('value', snapshot => {
                myData = snapshot.val() || { categories: {}, videos: {} };
                updateDropdowns();
                renderVideos();
            });
        } else {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    // --- ระบบแชร์ (Share) ---
    function generateShareLink() {
        const filterVal = document.getElementById('viewFilter').value;
        if (filterVal === 'all') return alert("กรุณาเลือกหมวดหมู่ที่ต้องการแชร์ก่อนครับ");

        const catName = myData.categories[filterVal].name;
        const videosToShare = [];
        const cats = myData.categories || {};
        
        let allowedIds = [filterVal];
        for (let id in cats) if (cats[id].parentId === filterVal) allowedIds.push(id);

        for (let key in myData.videos) {
            if (allowedIds.includes(myData.videos[key].catId)) {
                videosToShare.push({
                    youtubeId: myData.videos[key].youtubeId,
                    title: myData.videos[key].title
                });
            }
        }

        if (videosToShare.length === 0) return alert("ไม่มีวิดีโอในหมวดหมู่นี้ที่จะแชร์");

        // สร้าง ID การแชร์ในฐานข้อมูลสาธารณะ
        const shareRef = db.ref('public_shares').push();
        shareRef.set({
            catName: catName,
            videos: videosToShare,
            ownerName: currentUser.displayName,
            createdAt: Date.now()
        }).then(() => {
            const shareLink = window.location.origin + window.location.pathname + "?share=" + shareRef.key;
            navigator.clipboard.writeText(shareLink);
            alert("สร้างลิงก์แชร์เรียบร้อย! คัดลอกลิงก์ส่งให้เพื่อนได้เลยครับ 🔗");
        });
    }

    // --- ระบบนำเข้า (Import) ---
    function importSharedData() {
        if (!currentUser) return alert("กรุณา Login ก่อนนำเข้าข้อมูลครับ");
        
        // 1. สร้างหมวดหมู่ใหม่
        const newCatRef = db.ref('users/' + currentUser.uid + '/categories').push();
        newCatRef.set({
            name: sharedData.catName + " (จาก " + sharedData.ownerName + ")",
            parentId: null
        }).then(() => {
            // 2. เพิ่มวิดีโอทั้งหมด
            sharedData.videos.forEach(v => {
                db.ref('users/' + currentUser.uid + '/videos').push().set({
                    catId: newCatRef.key,
                    youtubeId: v.youtubeId,
                    title: v.title,
                    addedAt: Date.now()
                });
            });
            document.getElementById('importBar').style.display = 'none';
            alert("นำเข้าบทเรียนเรียบร้อยแล้ว! ดูได้ที่หมวดหมู่ใหม่ในคลังของคุณครับ ✨");
            // ล้าง URL share parameter
            window.history.replaceState({}, document.title, window.location.pathname);
        });
    }

    // --- ระบบวาดหน้าจอ (Render) และส่วนจัดการเดิม ---
    function renderVideos() {
        const display = document.getElementById('videoDisplay');
        const filterVal = document.getElementById('viewFilter').value;
        const shareControl = document.getElementById('shareControl');
        display.innerHTML = '';
        
        // แสดงปุ่มแชร์เมื่อเลือกหมวดหมู่เฉพาะ
        shareControl.style.display = (filterVal === 'all') ? 'none' : 'block';

        const videos = myData.videos || {};
        const cats = myData.categories || {};
        let allowedIds = [filterVal];
        if (filterVal !== 'all') for (let id in cats) if (cats[id].parentId === filterVal) allowedIds.push(id);

        const sortedKeys = Object.keys(videos).sort((a,b)=>(videos[b].addedAt || 0) - (videos[a].addedAt || 0));
        
        sortedKeys.forEach(key => {
            const v = videos[key];
            if (filterVal !== 'all' && !allowedIds.includes(v.catId)) return;
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="video-title-tab">${v.title || "ไม่มีชื่อ"}</div>
                <div class="iframe-wrap">
                    <iframe src="https://www.youtube-nocookie.com/embed/${v.youtubeId}?modestbranding=1&rel=0" allowfullscreen></iframe>
                </div>
                <div class="card-actions">
                    <button class="tool-btn" onclick="openEditModal('${key}', '${v.catId}')">✎ ย้าย</button>
                    <button class="tool-btn" onclick="openDeleteModal('${key}')" style="color:var(--danger);">✖ ลบ</button>
                </div>`;
            display.appendChild(card);
        });
    }

    // ฟังก์ชันช่วยจัดการ UI อื่นๆ (เหมือนเดิม)
    async function searchYouTube() {
        const query = document.getElementById('searchQuery').value.trim();
        if (!query) return;
        const resultsArea = document.getElementById('searchResults');
        resultsArea.innerHTML = "✨ กำลังค้นหา...";
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(query)}&type=video&key=${YT_API_KEY}`);
        const data = await res.json();
        resultsArea.innerHTML = "";
        data.items.forEach(item => {
            const card = document.createElement('div'); card.className = 'result-card';
            card.innerHTML = `<img src="${item.snippet.thumbnails.medium.url}"><div class="result-title">${item.snippet.title}</div><button class="btn-primary" style="width:100%; font-size:0.75rem;" onclick="openSaveModal('${item.id.videoId}', '${item.snippet.title.replace(/'/g, "\\'")}')">บันทึก</button>`;
            resultsArea.appendChild(card);
        });
    }
    function openSaveModal(id, title) { pendingVideoData = { id, title }; document.getElementById('modalTitleText').textContent = "บันทึก: " + title; document.getElementById('modalCatSelect').innerHTML = generateCategoryOptions(); document.getElementById('saveModal').style.display = 'flex'; }
    function executeQuickSave() { const catId = document.getElementById('modalCatSelect').value; db.ref('users/' + currentUser.uid + '/videos').push().set({ catId, youtubeId: pendingVideoData.id, title: pendingVideoData.title, addedAt: Date.now() }).then(() => closeModal('saveModal')); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function addCategory() { const name = document.getElementById('catInput').value.trim(); const parentId = document.getElementById('parentCatSelect').value; if (!name) return; db.ref('users/' + currentUser.uid + '/categories').push({ name, parentId: parentId === "none" ? null : parentId }); document.getElementById('catInput').value = ''; }
    function generateCategoryOptions() { const cats = myData.categories || {}; const mainCats = []; const subCats = {}; for (let id in cats) { if (!cats[id].parentId) mainCats.push({ id, ...cats[id] }); else { if (!subCats[cats[id].parentId]) subCats[cats[id].parentId] = []; subCats[cats[id].parentId].push({ id, ...cats[id] }); } } let html = '<option value="">-- เลือกหมวดหมู่ --</option>'; mainCats.forEach(main => { html += `<option value="${main.id}">${main.name}</option>`; if (subCats[main.id]) subCats[main.id].forEach(sub => { html += `<option value="${sub.id}">&nbsp;&nbsp;&nbsp;└ ${sub.name}</option>`; }); }); return html; }
    function updateDropdowns() { const pSel = document.getElementById('parentCatSelect'); const fSel = document.getElementById('viewFilter'); const cats = myData.categories || {}; let pHTML = '<option value="none">-- เป็นหมวดหลัก --</option>'; for(let key in cats) if(!cats[key].parentId) pHTML += `<option value="${key}">${cats[key].name}</option>`; pSel.innerHTML = pHTML; fSel.innerHTML = '<option value="all">💎 คลังความรู้ทั้งหมด</option>' + generateCategoryOptions().replace('-- เลือกหมวดหมู่ --', 'กรองตามเนื้อหา'); }
</script>
</body>
</html>
