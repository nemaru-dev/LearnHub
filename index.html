<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnHub | Smart Order</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #4834d4; --secondary: #686de0; --bg: #f4f7fa;
            --card-bg: #ffffff; --text-main: #2d3436; --accent: #22a6b3;
            --shadow: 0 8px 25px rgba(72, 52, 212, 0.12); --danger: #eb4d4b; --success: #6ab04c;
        }
        * { box-sizing: border-box; font-family: 'Mitr', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 10px; min-height: 100vh; -webkit-text-size-adjust: 100%; }
        .container { max-width: 1100px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: white; padding: 10px 15px; border-radius: 20px; box-shadow: var(--shadow); }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-info img { width: 32px; border-radius: 50%; border: 2px solid var(--accent); }
        .admin-panel, .search-section { background: var(--card-bg); padding: 15px; border-radius: 25px; margin-bottom: 15px; box-shadow: var(--shadow); }
        .search-section { background: #eff2ff; border-left: 5px solid var(--primary); }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e0e0e0; background: #fff; font-size: 16px; outline: none; }
        button { padding: 12px 18px; border-radius: 12px; border: none; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-google { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 16px 40px; border-radius: 50px; font-size: 1.1rem; border:none; }
        .video-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .video-card { background: white; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid #fff; }
        .video-title-tab { padding: 10px 15px; background: #fdfdfd; font-size: 0.85rem; font-weight: 500; color: var(--primary); line-height: 1.4; }
        .iframe-wrap { position: relative; padding-top: 56.25%; background: #000; }
        .iframe-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .card-actions { display: flex; justify-content: space-around; padding: 10px; background: #fff; }
        .tool-btn { background: #f8f9fb; border: none; padding: 8px 15px; border-radius: 10px; font-size: 0.8rem; color: #636e72; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal-content { background: white; width: 95%; max-width: 450px; border-radius: 25px; position: relative; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: popUp 0.3s ease-out; }
        @keyframes popUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 1.1rem; color: var(--primary); }
        .modal-body { padding: 10px 20px 20px; overflow-y: auto; flex: 1; }
        .cat-manage-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 5px; border-bottom: 1px solid #f9f9f9; }
        #mainApp, #loginPage { display: none; }
        @media (min-width: 768px) { .input-group { flex-direction: row; } .video-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าแรก / Login -->
    <div id="loginPage" style="text-align:center; margin-top:15vh;">
        <h1 style="color: var(--primary); font-size: 3rem; margin: 0;">🎓 LearnHub</h1>
        <p style="color: #636e72; margin-bottom: 30px;">“Your personal learning hub.”</p>
        <button class="btn-primary" style="padding:15px 40px; border-radius:50px; font-size:1.1rem;" onclick="login()">🚀 Start with Google</button>
    </div>

    <!-- ส่วนหลักของแอป -->
    <div id="mainApp">
        <div class="header">
            <div class="user-info"><img id="userImg" src=""> <span id="userName" style="font-weight:500;"></span></div>
            <button onclick="auth.signOut()" style="background:none; border:none; color:#aaa; font-size:0.8rem;">Logout</button>
        </div>

        <div class="admin-panel">
            <span style="font-size:0.8rem; color:var(--primary); font-weight:bold;">📚 สร้างหมวดหมู่</span>
            <div class="input-group" style="margin-top:10px;">
                <select id="parentCatSelect"><option value="none">-- เป็นหมวดหลัก --</option></select>
                <input type="text" id="catInput" placeholder="ชื่อหมวดหมู่...">
                <button class="btn-primary" onclick="addCategory()">สร้าง</button>
            </div>
        </div>

        <div class="search-section">
            <span style="font-size:0.8rem; color:var(--primary); font-weight:bold;">🔍 ค้นหาบทเรียน</span>
            <div class="input-group" style="margin-top:10px;">
                <input type="text" id="searchQuery" placeholder="พิมพ์สิ่งที่อยากเรียนรู้...">
                <button class="btn-accent" onclick="searchYouTube()">ค้นหา</button>
            </div>
            <div id="searchResults" style="display:flex; overflow-x:auto; gap:10px; padding-top:10px;"></div>
        </div>

        <div style="text-align:center; margin-bottom:15px;">
            <div style="display:flex; gap:8px; max-width:550px; margin:auto;">
                <select id="viewFilter" onchange="renderVideos()" style="border-radius:50px; font-weight:bold; color:var(--primary); box-shadow:var(--shadow); flex:1;">
                    <option value="all">💎 คลังความรู้ทั้งหมด</option>
                </select>
                <button class="btn-primary" style="border-radius:50%; width:48px; height:48px; padding:0;" onclick="openCatManager()">⚙️</button>
            </div>
            <div id="shareControl" style="margin-top:10px; display:none;">
                <button class="btn-primary" style="background:var(--accent); border-radius:50px; font-size:0.8rem;" onclick="openShareModal()">🔗 แชร์หมวดหมู่นี้</button>
            </div>
        </div>

        <div id="videoDisplay" class="video-grid"></div>
    </div>
</div>

<!-- --- MODALS --- -->
<div id="catManagerModal" class="modal" onclick="closeModalOnOutside(event, 'catManagerModal')">
    <div class="modal-content">
        <div class="modal-header"><h3>จัดการหมวดหมู่ 📁</h3><span class="close-x" onclick="closeModal('catManagerModal')">&times;</span></div>
        <div class="modal-body" id="catManagerList"></div>
    </div>
</div>

<div id="catEditModal" class="modal" onclick="closeModalOnOutside(event, 'catEditModal')">
    <div class="modal-content">
        <div class="modal-header"><h3>แก้ไขโครงสร้างหมวดหมู่</h3><span class="close-x" onclick="closeModal('catEditModal')">&times;</span></div>
        <div class="modal-body">
            <label style="font-size:0.8rem; color:var(--primary);">ชื่อหมวดหมู่:</label>
            <input type="text" id="editCatNameInput" style="margin:10px 0 20px;">
            <label style="font-size:0.8rem; color:var(--primary);">ย้ายไปอยู่ภายใต้หมวดหมู่:</label>
            <select id="editCatParentSelect" style="margin-top:10px;"></select>
            <button class="btn-primary" style="width:100%; margin-top:25px;" onclick="executeCatUpdate()">บันทึกการเปลี่ยนแปลง</button>
        </div>
    </div>
</div>

<div id="editModal" class="modal" onclick="closeModalOnOutside(event, 'editModal')">
    <div class="modal-content">
        <div class="modal-header"><h3>ย้ายหมวดหมู่บทเรียน 💡</h3><span class="close-x" onclick="closeModal('editModal')">&times;</span></div>
        <div class="modal-body"><select id="editCatSelect"></select><button class="btn-primary" style="width:100%; margin-top:20px;" onclick="saveEdit()">ย้ายเดี๋ยวนี้</button></div>
    </div>
</div>

<div id="saveModal" class="modal" onclick="closeModalOnOutside(event, 'saveModal')">
    <div class="modal-content">
        <div class="modal-header"><h3 id="modalTitleText" style="font-size:0.9rem;">บันทึกลงคลัง</h3><span class="close-x" onclick="closeModal('saveModal')">&times;</span></div>
        <div class="modal-body"><select id="modalCatSelect"></select><button class="btn-primary" style="width:100%; margin-top:20px;" onclick="executeQuickSave()">บันทึก ✨</button></div>
    </div>
</div>

<div id="deleteModal" class="modal" onclick="closeModalOnOutside(event, 'deleteModal')">
    <div class="modal-content"><div class="modal-body" style="text-align:center;"><div style="font-size:3rem;">🗑️</div><h3>ยืนยันการลบ?</h3><p style="color:#636e72;">บทเรียนนี้จะหายไปจาก LearnHub ของคุณ</p><button class="btn-primary" id="confirmDeleteBtn" style="background:var(--danger); width:100%; margin-top:10px;">ลบเลย</button><button onclick="closeModal('deleteModal')" style="width:100%; background:none; margin-top:10px; color:#aaa;">ยกเลิก</button></div></div>
</div>

<script>
    const YT_API_KEY = "AIzaSyBVsxZxnjoMEE6uCk3qaAoenOLEdbgg3U4";
    const firebaseConfig = {
        apiKey: "AIzaSyDWr7Ev6aPzwNPTfuRYp46Pb_a-uJboiXg",
        authDomain: "video-playlist-40cf0.firebaseapp.com",
        projectId: "video-playlist-40cf0",
        storageBucket: "video-playlist-40cf0.firebasestorage.app",
        messagingSenderId: "128728975658",
        appId: "1:128728975658:web:255d64e66af8ef66c57653",
        databaseURL: "https://video-playlist-40cf0-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let myData = { categories: {}, videos: {} };
    let editingCatId = null;

    function login() { auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); }
    function logout() { auth.signOut().then(() => window.location.reload()); }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userName').textContent = user.displayName;
            document.getElementById('userImg').src = user.photoURL;
            db.ref('users/' + user.uid).on('value', snapshot => {
                myData = snapshot.val() || { categories: {}, videos: {} };
                updateDropdowns();
                renderVideos();
            });
        } else {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function closeModalOnOutside(event, id) { if(event.target.className === 'modal') closeModal(id); }

    // --- แก้ไขระบบจัดการหมวดหมู่ให้เรียงลำดับตามความสัมพันธ์ ---
    function openCatManager() {
        const list = document.getElementById('catManagerList');
        list.innerHTML = "";
        const cats = myData.categories || {};
        
        // แยกกลุ่มข้อมูล
        const mainCats = [];
        const subCats = {};
        for (let id in cats) {
            if (!cats[id].parentId) mainCats.push({ id, ...cats[id] });
            else {
                if (!subCats[cats[id].parentId]) subCats[cats[id].parentId] = [];
                subCats[cats[id].parentId].push({ id, ...cats[id] });
            }
        }

        // ฟังก์ชันช่วยสร้าง HTML Item
        const createItem = (cat, isSub = false) => {
            const d = document.createElement('div');
            d.className = 'cat-manage-item';
            d.innerHTML = `
                <span style="font-size:0.9rem;">${isSub ? '&nbsp;&nbsp;&nbsp;└ ' : '<b>• </b>'} ${cat.name}</span>
                <div>
                    <button class="tool-btn" style="padding:5px 12px; margin-right:5px;" onclick="openEditCatModal('${cat.id}')">✎</button>
                    <button class="tool-btn" style="padding:5px 12px; color:var(--danger);" onclick="deleteCat('${cat.id}')">🗑️</button>
                </div>
            `;
            return d;
        };

        // วาดรายการโดยเรียงจาก แม่ -> ลูก
        mainCats.forEach(main => {
            list.appendChild(createItem(main, false));
            if (subCats[main.id]) {
                subCats[main.id].forEach(sub => list.appendChild(createItem(sub, true)));
            }
        });

        document.getElementById('catManagerModal').style.display = 'flex';
    }

    function openEditCatModal(id) {
        editingCatId = id;
        const cat = myData.categories[id];
        document.getElementById('editCatNameInput').value = cat.name;
        let h = '<option value="none">-- ไม่มี (ตั้งเป็นหมวดหลัก) --</option>';
        for (let key in myData.categories) {
            if (key !== id && !myData.categories[key].parentId) h += `<option value="${key}">${myData.categories[key].name}</option>`;
        }
        document.getElementById('editCatParentSelect').innerHTML = h;
        document.getElementById('editCatParentSelect').value = cat.parentId || "none";
        closeModal('catManagerModal');
        document.getElementById('catEditModal').style.display = 'flex';
    }

    function executeCatUpdate() {
        const name = document.getElementById('editCatNameInput').value.trim();
        const parentId = document.getElementById('editCatParentSelect').value;
        if (!name) return;
        db.ref('users/'+currentUser.uid+'/categories/'+editingCatId).update({ name, parentId: parentId==='none'?null:parentId })
        .then(() => { closeModal('catEditModal'); openCatManager(); });
    }

    function addCategory() {
        const n = document.getElementById('catInput').value.trim(); if(!n) return;
        db.ref('users/'+currentUser.uid+'/categories').push({ name:n, parentId: document.getElementById('parentCatSelect').value==='none'?null:document.getElementById('parentCatSelect').value });
        document.getElementById('catInput').value = "";
    }
    
    async function searchYouTube() {
        const q = document.getElementById('searchQuery').value; if(!q) return;
        const area = document.getElementById('searchResults'); area.innerHTML = "🔍 ค้นหา...";
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(q)}&type=video&key=${YT_API_KEY}`);
        const data = await res.json(); area.innerHTML = "";
        data.items.forEach(item => {
            const d = document.createElement('div'); d.style.minWidth="140px";
            d.innerHTML = `<img src="${item.snippet.thumbnails.medium.url}" style="width:100%; border-radius:12px;"><p style="font-size:0.6rem; height:25px; overflow:hidden; margin:5px 0;">${item.snippet.title}</p>
                           <button class="btn-primary" style="width:100%; font-size:0.7rem; padding:5px;" onclick="openSaveModal('${item.id.videoId}', '${item.snippet.title.replace(/'/g,"")}')">บันทึก</button>`;
            area.appendChild(d);
        });
    }

    function openSaveModal(id, title) { pendingVideoData = { id, title }; document.getElementById('modalTitleText').textContent = title; document.getElementById('modalCatSelect').innerHTML = generateCategoryOptions(); document.getElementById('saveModal').style.display = 'flex'; }
    function executeQuickSave() { db.ref('users/'+currentUser.uid+'/videos').push().set({ catId: document.getElementById('modalCatSelect').value, youtubeId: pendingVideoData.id, title: pendingVideoData.title, addedAt: Date.now() }).then(() => closeModal('saveModal')); }
    function openEditModal(k, c) { editingVideoKey = k; document.getElementById('editCatSelect').innerHTML = generateCategoryOptions(); document.getElementById('editCatSelect').value = c; document.getElementById('editModal').style.display = 'flex'; }
    function saveEdit() { db.ref('users/'+currentUser.uid+'/videos/'+editingVideoKey).update({ catId: document.getElementById('editCatSelect').value }).then(() => closeModal('editModal')); }
    function deleteCat(id) { if(confirm("ลบหมวดหมู่?")) db.ref('users/'+currentUser.uid+'/categories/'+id).remove().then(()=>openCatManager()); }
    function openDeleteModal(k) { deletingVideoKey = k; document.getElementById('deleteModal').style.display = 'flex'; }
    document.getElementById('confirmDeleteBtn').onclick = function() { db.ref('users/'+currentUser.uid+'/videos/'+deletingVideoKey).remove().then(() => closeModal('deleteModal')); };

    function generateCategoryOptions() {
        const cats = myData.categories || {}; let main = []; let sub = {};
        for (let k in cats) { if (!cats[k].parentId) main.push({id:k, n:cats[k].name}); else { if (!sub[cats[k].parentId]) sub[cats[k].parentId] = []; sub[cats[k].parentId].push({id:k, n:cats[k].name}); } }
        let h = '<option value="">-- เลือกหมวดหมู่ --</option>';
        main.forEach(m => { h += `<option value="${m.id}" style="font-weight:bold;">${m.n}</option>`; if (sub[m.id]) sub[m.id].forEach(s => h += `<option value="${s.id}">&nbsp;&nbsp;&nbsp;└ ${s.n}</option>`); });
        return h;
    }

    function updateDropdowns() {
        const cats = myData.categories || {}; let p = '<option value="none">-- เป็นหมวดหลัก --</option>';
        for (let k in cats) if (!cats[k].parentId) p += `<option value="${k}">${cats[k].name}</option>`;
        document.getElementById('parentCatSelect').innerHTML = p;
        document.getElementById('viewFilter').innerHTML = '<option value="all">💎 คลังทั้งหมด</option>' + generateCategoryOptions().replace('-- เลือกหมวดหมู่ --', 'แสดงตามหมวดหมู่');
    }

    function renderVideos() {
        const area = document.getElementById('videoDisplay'); const filter = document.getElementById('viewFilter').value;
        area.innerHTML = ""; const vids = myData.videos || {}; const cats = myData.categories || {};
        let allowed = [filter]; for (let id in cats) if (cats[id].parentId === filter) allowed.push(id);
        Object.keys(vids).sort((a,b) => (vids[b].addedAt || 0) - (vids[a].addedAt || 0)).forEach(k => {
            if (filter !== 'all' && !allowed.includes(vids[k].catId)) return;
            const div = document.createElement('div'); div.className = 'video-card';
            div.innerHTML = `<div class="video-title-tab">${vids[k].title || "ไม่มีชื่อ"}</div>
                              <div class="iframe-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${vids[k].youtubeId}?rel=0&modestbranding=1" allowfullscreen></iframe></div>
                              <div class="card-actions"><button class="tool-btn" onclick="openEditModal('${k}','${vids[k].catId}')">✎ ย้าย</button>
                                <button class="tool-btn" onclick="openDeleteModal('${k}')" style="color:var(--danger)">✖ ลบ</button></div>`;
            area.appendChild(div);
        });
    }
</script>
</body>
</html>
