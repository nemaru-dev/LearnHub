<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnHub | Fix Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #4834d4; --secondary: #686de0; --bg: #f4f7fa; --card-bg: #ffffff; --text: #2d3436; --accent: #22a6b3; --shadow: 0 8px 25px rgba(72,52,212,0.1); --danger: #eb4d4b; --success: #6ab04c; }
        * { box-sizing: border-box; font-family: 'Mitr', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; min-height: 100vh; }
        .container { max-width: 1100px; margin: auto; }
        button { cursor: pointer; border: none; transition: 0.2s; border-radius: 12px; font-weight: 500; }
        input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e0e0e0; font-size: 16px; outline: none; background: #fff; }
        
        .header, .panel, .v-card, .modal-content { background: #fff; box-shadow: var(--shadow); border-radius: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; margin-bottom: 15px; }
        .panel { padding: 15px; margin-bottom: 15px; border-radius: 25px; }
        .search-area { background: #eff2ff; border-left: 5px solid var(--primary); }
        
        .lib-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .search-box { position: relative; flex: 1; }
        .search-box input { padding-left: 40px; }
        .search-box::before { content: '🔍'; position: absolute; left: 15px; top: 12px; font-size: 14px; opacity: 0.5; }

        .video-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .v-card { overflow: hidden; transition: 0.3s; border: 1px solid #fff; }
        .v-title { padding: 12px 15px; background: #fdfdfd; font-size: 0.85rem; color: var(--primary); line-height: 1.4; border-bottom: 1px solid #eee; min-height: 45px; }
        .v-iframe { position: relative; padding-top: 56.25%; background: #000; }
        .v-iframe iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .card-actions { display: flex; justify-content: space-around; padding: 12px; }
        .tool-btn { background: #f8f9fb; padding: 8px 15px; font-size: 0.8rem; color: #636e72; border-radius: 10px; }

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .modal-content { width: 95%; max-width: 420px; max-height: 85vh; display: flex; flex-direction: column; animation: pop .3s; }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } }
        .m-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .m-body { padding: 20px; overflow-y: auto; }
        .cat-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f8f8f8; align-items: center; }

        #mainApp, #loginPage, #importBar { display: none; }
        @media (min-width: 768px) { .video-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } .lib-controls { flex-direction: row; } }
    </style>
</head>
<body>

<div class="container">
    <!-- Import Alert -->
    <div id="importBar" class="panel" style="background:var(--success); color:#fff; text-align:center;">
        <span id="importText">พบข้อมูลแชร์ ✨</span>
        <button onclick="importData()" style="background:#fff; color:var(--success); padding:5px 15px; margin-left:10px;">นำเข้า</button>
    </div>

    <!-- Login -->
    <div id="loginPage" style="text-align:center; margin-top:15vh;">
        <h1 style="color:var(--primary); font-size:3rem; margin:0;">🎓 LearnHub</h1>
        <p>“Your personal learning hub.”</p><br>
        <button onclick="auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider())" style="background:linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; padding:16px 45px; border-radius:50px; font-size:1.1rem;">Start with Google</button>
    </div>

    <!-- App -->
    <div id="mainApp">
        <div class="header">
            <div style="display:flex; align-items:center; gap:8px;"><img id="userImg" src="" style="width:32px; border-radius:50%;"><span id="userName" style="font-weight:500;"></span></div>
            <button onclick="auth.signOut().then(()=>location.reload())" style="background:none; color:#aaa;">Logout</button>
        </div>

        <div class="panel">
            <label style="font-size:0.8rem; color:var(--primary); font-weight:bold;">📚 สร้างหมวดหมู่</label>
            <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
                <select id="pCatSel"><option value="none">-- เป็นหมวดหลัก --</option></select>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="catInp" placeholder="ชื่อหมวดหมู่ใหม่...">
                    <button onclick="actCat('add')" style="background:var(--primary); color:#fff; padding:0 20px;">สร้าง</button>
                </div>
            </div>
        </div>

        <div class="panel search-area">
            <label style="font-size:0.8rem; color:var(--primary); font-weight:bold;">🔍 ค้นหาความรู้ใหม่</label>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <input type="text" id="qInp" placeholder="พิมพ์สิ่งที่อยากเรียนรู้...">
                <button onclick="searchYT()" style="background:var(--accent); color:#fff; padding:0 25px;">ค้นหา</button>
            </div>
            <div id="searchRes" style="display:flex; overflow-x:auto; gap:12px; padding-top:10px; scrollbar-width:none;"></div>
        </div>

        <div class="lib-controls">
            <div style="display:flex; gap:8px; flex:1;">
                <select id="vFilter" onchange="renderVids()" style="border-radius:50px; font-weight:bold; color:var(--primary);"></select>
                <button onclick="toggleM('catMModal',1)" style="background:var(--primary); color:#fff; width:48px; height:48px; flex-shrink:0;">⚙️</button>
            </div>
            <div class="search-box">
                <input type="text" id="saveSearch" oninput="renderVids()" placeholder="ค้นหาคลิปในคลัง...">
            </div>
        </div>

        <div id="shareCtrl" style="text-align:center; margin-bottom:15px; display:none;">
            <button onclick="toggleM('shareModal',1)" style="background:var(--accent); color:#fff; padding:8px 25px; border-radius:50px; font-size:0.85rem;">🔗 แชร์หมวดหมู่นี้ให้เพื่อน</button>
        </div>

        <div id="vDisp" class="video-grid"></div>
    </div>
</div>

<!-- Modals -->
<div id="catMModal" class="modal"><div class="modal-content"><div class="m-header"><h3>จัดการหมวดหมู่</h3><span onclick="toggleM('catMModal',0)" style="font-size:24px; cursor:pointer;">&times;</span></div><div class="m-body" id="catMList"></div></div></div>
<div id="saveModal" class="modal"><div class="modal-content"><div class="m-header"><h3 id="saveMTitle" style="font-size:0.9rem;">บันทึก</h3></div><div class="m-body"><select id="saveCatSel"></select><button onclick="saveVid()" style="background:var(--primary); color:#fff; width:100%; margin-top:15px; padding:12px;">บันทึก ✨</button></div></div></div>
<div id="editModal" class="modal"><div class="modal-content"><div class="m-header"><h3>ย้ายหมวดหมู่</h3></div><div class="m-body"><select id="editCatSel"></select><button onclick="actVid('move')" style="background:var(--primary); color:#fff; width:100%; margin-top:15px; padding:12px;">ย้ายเดี๋ยวนี้</button></div></div></div>
<div id="delModal" class="modal"><div class="modal-content"><div class="m-body" style="text-align:center;"><h2 style="color:var(--danger)">ลบวิดีโอ?</h2><button onclick="actVid('del')" style="background:var(--danger); color:#fff; width:100%; padding:12px;">ยืนยันการลบ</button><button onclick="toggleM('delModal',0)" style="background:none; color:#aaa; margin-top:10px;">ยกเลิก</button></div></div></div>
<div id="shareModal" class="modal"><div class="modal-content"><div class="m-header"><h3>แชร์ความรู้ 🔗</h3></div><div class="m-body"><textarea id="sNote" placeholder="ฝากข้อความถึงเพื่อน..." style="width:100%; height:80px; padding:10px; border-radius:12px; border:1px solid #ddd;"></textarea><button onclick="doShare()" style="background:var(--accent); color:#fff; width:100%; margin-top:15px; padding:12px;">คัดลอกลิงก์แชร์</button></div></div></div>

<script>
    const YT_KEY = "AIzaSyBVsxZxnjoMEE6uCk3qaAoenOLEdbgg3U4";
    const firebaseConfig = { apiKey: "AIzaSyDWr7Ev6aPzwNPTfuRYp46Pb_a-uJboiXg", authDomain: "video-playlist-40cf0.firebaseapp.com", projectId: "video-playlist-40cf0", databaseURL: "https://video-playlist-40cf0-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.database();
    let user = null, myData = { categories: {}, videos: {} }, tmp = {};

    auth.onAuthStateChanged(u => {
        if (u) {
            user = u; document.getElementById('loginPage').style.display = 'none'; document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userName').innerText = u.displayName; document.getElementById('userImg').src = u.photoURL;
            db.ref('users/'+u.uid).on('value', s => { myData = s.val() || {categories:{}, videos:{}}; updateUI(); });
        } else { document.getElementById('loginPage').style.display = 'block'; }
    });

    const toggleM = (id, show) => document.getElementById(id).style.display = show ? 'flex' : 'none';
    const uRef = (path) => db.ref(`users/${user.uid}/${path}`);

    const actCat = (type, id) => {
        if (type === 'add') {
            const n = document.getElementById('catInp').value;
            if (n) uRef('categories').push({ name: n, parentId: document.getElementById('pCatSel').value === 'none' ? null : document.getElementById('pCatSel').value });
            document.getElementById('catInp').value = "";
        } else if (type === 'del') { if (confirm("ลบหมวดหมู่?")) uRef(`categories/${id}`).remove(); }
    };

    async function searchYT() {
        const q = document.getElementById('qInp').value; if (!q) return;
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(q)}&type=video&key=${YT_KEY}`);
        const data = await res.json();
        document.getElementById('searchRes').innerHTML = (data.items || []).map(i => `
            <div style="min-width:140px; background:#fff; padding:10px; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
                <img src="${i.snippet.thumbnails.medium.url}" style="width:100%; border-radius:10px;">
                <p style="font-size:0.6rem; height:25px; overflow:hidden; margin:5px 0; line-height:1.2;">${i.snippet.title}</p>
                <button onclick="openSave('${i.id.videoId}', '${i.snippet.title.replace(/'/g,"")}')" style="background:var(--primary); color:#fff; width:100%; font-size:0.7rem; padding:6px;">บันทึก</button>
            </div>
        `).join('');
    }

    const openSave = (id, t) => { tmp = {id, t}; document.getElementById('saveMTitle').innerText = t; toggleM('saveModal', 1); };
    const saveVid = () => { uRef('videos').push({ catId: document.getElementById('saveCatSel').value, youtubeId: tmp.id, title: tmp.t, addedAt: Date.now() }); toggleM('saveModal', 0); };

    const actVid = (type, k, c) => {
        if (type === 'moveUI') { tmp.k = k; document.getElementById('editCatSel').value = c; toggleM('editModal', 1); }
        else if (type === 'move') { uRef(`videos/${tmp.k}`).update({ catId: document.getElementById('editCatSel').value }); toggleM('editModal', 0); }
        else if (type === 'delUI') { tmp.k = k; toggleM('delModal', 1); }
        else if (type === 'del') { uRef(`videos/${tmp.k}`).remove(); toggleM('delModal', 0); }
    };

    function updateUI() {
        const cats = myData.categories || {};
        let opts = '<option value="">-- เลือกหมวดหมู่ --</option>', pOpts = '<option value="none">-- เป็นหมวดหลัก --</option>';
        const main = [], sub = {};
        Object.keys(cats).forEach(k => { if(!cats[k].parentId) main.push({k, ...cats[k]}); else { (sub[cats[k].parentId] = sub[cats[k].parentId] || []).push({k, ...cats[k]}); } });
        
        main.forEach(m => {
            opts += `<option value="${m.k}">${m.name}</option>`;
            pOpts += `<option value="${m.k}">${m.name}</option>`;
            if (sub[m.k]) sub[m.k].forEach(s => opts += `<option value="${s.k}">└ ${s.name}</option>`);
        });

        const currentFilter = document.getElementById('vFilter').value || 'all';
        document.getElementById('saveCatSel').innerHTML = document.getElementById('editCatSel').innerHTML = opts;
        document.getElementById('pCatSel').innerHTML = pOpts;
        document.getElementById('vFilter').innerHTML = '<option value="all">💎 คลังทั้งหมด</option>' + opts;
        document.getElementById('vFilter').value = currentFilter;
        
        document.getElementById('catMList').innerHTML = main.map(m => `
            <div class="cat-item"><span><b>•</b> ${m.name}</span><button onclick="actCat('del','${m.k}')" style="color:red; background:none; font-size:1.2rem;">🗑️</button></div>
            ${(sub[m.k]||[]).map(s => `<div class="cat-item"><span>&nbsp;&nbsp;&nbsp;└ ${s.name}</span><button onclick="actCat('del','${s.k}')" style="color:red; background:none; font-size:1.2rem;">🗑️</button></div>`).join('')}
        `).join('') || '<p style="text-align:center; color:#ccc; padding:20px;">ยังไม่มีหมวดหมู่</p>';

        renderVids();
    }

    function renderVids() {
        const filter = document.getElementById('vFilter').value;
        const search = document.getElementById('saveSearch').value.toLowerCase();
        const vids = myData.videos || {};
        const cats = myData.categories || {};
        
        // กรองหมวดหมู่รวมถึงหมวดลูก
        let allowed = [filter];
        if (filter !== 'all') Object.keys(cats).forEach(k => { if(cats[k].parentId === filter) allowed.push(k); });

        document.getElementById('shareCtrl').style.display = (filter==='all'?'none':'block');

        const html = Object.keys(vids).sort((a,b) => vids[b].addedAt - vids[a].addedAt).map(k => {
            const v = vids[k];
            const isMatchCat = (filter === 'all' || allowed.includes(v.catId));
            const isMatchSearch = !search || (v.title && v.title.toLowerCase().includes(search));

            if (isMatchCat && isMatchSearch) {
                return `<div class="v-card">
                    <div class="v-title">${v.title || "ไม่มีชื่อ"}</div>
                    <div class="v-iframe"><iframe src="https://www.youtube-nocookie.com/embed/${v.youtubeId}?rel=0&modestbranding=1" allowfullscreen></iframe></div>
                    <div class="card-actions">
                        <button class="tool-btn" onclick="actVid('moveUI','${k}','${v.catId}')">✎ ย้าย</button>
                        <button class="tool-btn" onclick="actVid('delUI','${k}')" style="color:var(--danger)">✖ ลบ</button>
                    </div>
                </div>`;
            }
            return '';
        }).join('');

        document.getElementById('vDisp').innerHTML = html || '<p style="grid-column:1/-1; text-align:center; padding:50px; color:#aaa;">ไม่พบวิดีโอในส่วนนี้ ✨</p>';
    }

    const doShare = () => {
        const f = document.getElementById('vFilter').value; if(f==='all') return;
        const vids = Object.values(myData.videos).filter(v => v.catId === f).map(v => ({id: v.youtubeId, t: v.title}));
        db.ref('public_shares').push({ cat: myData.categories[f].name, msg: document.getElementById('sNote').value, vids, owner: user.displayName }).then(r => {
            const link = `${location.origin}${location.pathname}?share=${r.key}`;
            const el = document.createElement('textarea'); el.value = link; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            alert("คัดลอกลิงก์แชร์แล้ว! ✨"); toggleM('shareModal', 0);
        });
    };

    const urlParams = new URLSearchParams(window.location.search);
    const shareId = urlParams.get('share');
    if (shareId) db.ref('public_shares/'+shareId).once('value', s => { if(s.exists()){ tmp.shared = s.val(); document.getElementById('importBar').style.display='block'; } });

    const importData = () => {
        if(!user) return alert("Login ก่อนครับ");
        const r = uRef('categories').push(); r.set({name: tmp.shared.cat + " (Shared)", parentId: null});
        tmp.shared.vids.forEach(v => uRef('videos').push({catId: r.key, youtubeId: v.id, title: v.t, addedAt: Date.now()}));
        location.href = location.origin + location.pathname;
    };
</script>
</body>
</html>
