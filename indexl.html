<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnHub | Your personal learning hub.</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #4834d4; --secondary: #686de0; --bg: #f4f7fa;
            --card-bg: #ffffff; --text-main: #2d3436; --accent: #22a6b3;
            --shadow: 0 8px 20px rgba(72, 52, 212, 0.1); --danger: #eb4d4b;
        }

        * { box-sizing: border-box; font-family: 'Mitr', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 10px; min-height: 100vh; }
        .container { max-width: 1100px; margin: auto; }

        /* Login Page UI */
        .login-box { 
            background: var(--card-bg); padding: 60px 20px; border-radius: 40px; 
            text-align: center; box-shadow: var(--shadow); margin-top: 10vh; border: 4px solid #fff;
        }
        .icon-brand { font-size: 4rem; margin-bottom: 10px; display: block; }
        .btn-google { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white; border: none; padding: 16px 40px; border-radius: 50px; 
            font-size: 1.1rem; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(72, 52, 212, 0.2);
        }
        .btn-google:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(72, 52, 212, 0.3); }

        /* Header UI */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; background: white; padding: 12px 20px; 
            border-radius: 20px; box-shadow: var(--shadow);
        }
        .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; }
        .user-info img { width: 35px; border-radius: 50%; border: 2px solid var(--accent); }

        /* Content Panels */
        .admin-panel, .search-section { 
            background: var(--card-bg); padding: 20px; border-radius: 25px; 
            margin-bottom: 20px; box-shadow: var(--shadow); 
        }
        .search-section { background: #eff2ff; border-left: 5px solid var(--primary); }

        .label { font-size: 0.85rem; color: var(--primary); font-weight: 500; margin-bottom: 8px; display: block; text-transform: uppercase; }
        
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        input, select { 
            width: 100%; padding: 14px; border-radius: 15px; 
            border: 1px solid #e0e0e0; background: #fff; font-size: 0.95rem; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); }

        button { padding: 12px 20px; border-radius: 15px; border: none; font-weight: 500; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }

        /* YouTube Search Results */
        .search-results { display: flex; overflow-x: auto; gap: 15px; padding: 10px 0; scrollbar-width: none; }
        .search-results::-webkit-scrollbar { display: none; }
        .result-card { min-width: 180px; width: 180px; background: white; padding: 10px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .result-card img { width: 100%; border-radius: 12px; }
        .result-title { font-size: 0.75rem; height: 35px; overflow: hidden; margin: 8px 0; line-height: 1.2; color: #444; }

        /* Video Grid & Card Display */
        .video-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .video-card { background: white; border-radius: 25px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
        .video-card:hover { transform: translateY(-5px); }
        
        .video-title-tab {
            padding: 12px 15px; background: #fdfdfd; border-bottom: 1px solid #f0f0f0;
            font-size: 0.85rem; font-weight: 500; color: var(--primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .iframe-wrap { position: relative; padding-top: 56.25%; background: #000; }
        .iframe-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .card-actions { display: flex; justify-content: space-around; padding: 15px; background: #fff; }
        .tool-btn { background: #f8f9fb; border: none; padding: 8px 18px; border-radius: 12px; font-size: 0.85rem; color: #636e72; }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); padding: 20px; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }

        #mainApp, .hidden { display: none; }

        @media (min-width: 768px) {
            .input-group { flex-direction: row; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Landing Page: LearnHub -->
    <div id="loginPage" class="login-box">
        <span class="icon-brand">🎓</span>
        <h1 style="color: var(--primary); margin: 0; font-size: 2.8rem;">LearnHub</h1>
        <p style="margin-bottom: 40px; color: #636e72; font-size: 1.2rem; font-weight: 300;">“Your personal learning hub.”</p>
        <button class="btn-google" onclick="login()">🚀 Start Learning Now</button>
    </div>

    <!-- Main Application UI -->
    <div id="mainApp">
        <div class="header">
            <div class="user-info">
                <img id="userImg" src="">
                <span id="userName" style="font-weight: 500;">My Workspace</span>
            </div>
            <button onclick="auth.signOut()" style="background:none; border:none; color:#b2bec3; font-size:0.85rem; cursor:pointer;">Logout</button>
        </div>

        <!-- Search Knowledge -->
        <div class="search-section">
            <span class="label">🔍 ค้นหาความรู้ใหม่</span>
            <div class="input-group">
                <input type="text" id="searchQuery" placeholder="พิมพ์หัวข้อที่คุณอยากศึกษา...">
                <button class="btn-accent" onclick="searchYouTube()">ค้นหา</button>
            </div>
            <div id="searchResults" class="search-results">
                <p style="color:#b2bec3; font-size:0.85rem; padding:15px;">เริ่มค้นหาวิดีโอจาก YouTube ได้ที่นี่...</p>
            </div>
        </div>

        <!-- Admin Controls -->
        <div class="admin-panel">
            <span class="label">📚 จัดการหมวดหมู่การเรียนรู้</span>
            <div class="input-group">
                <select id="parentCatSelect"><option value="none">-- เป็นหมวดหลัก --</option></select>
                <input type="text" id="catInput" placeholder="ชื่อหมวดหมู่ใหม่...">
                <button class="btn-primary" onclick="addCategory()">สร้าง</button>
            </div>
            <div style="margin-top: 15px; border-top: 1px solid #f0f0f0; padding-top: 15px;">
                <span class="label">🔗 บันทึกจากลิงก์ YouTube</span>
                <div class="input-group">
                    <input type="text" id="videoUrl" placeholder="วางลิงก์วิดีโอที่นี่...">
                    <button class="btn-primary" onclick="addVideoByUrl()">บันทึกความรู้</button>
                </div>
            </div>
        </div>

        <!-- Category Filter -->
        <div style="margin-bottom: 20px; text-align: center;">
            <select id="viewFilter" onchange="renderVideos()" style="width: 100%; max-width: 500px; border: 2px solid white; box-shadow: var(--shadow); font-weight: bold; color: var(--primary); border-radius: 50px; text-align-last: center;">
                <option value="all">💎 คลังความรู้ทั้งหมด</option>
            </select>
        </div>

        <!-- Video Library -->
        <div id="videoDisplay" class="video-grid"></div>
    </div>
</div>

<!-- Modal: บันทึกวิดีโอ -->
<div id="saveModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitleText" style="color:var(--primary); font-size:1rem; margin-bottom:20px; line-height: 1.4;">บันทึกลงคลัง ✨</h3>
        <select id="modalCatSelect" style="margin-bottom: 25px;"></select>
        <button class="btn-primary" style="width: 100%; margin-bottom: 12px;" onclick="executeQuickSave()">ตกลง</button>
        <button onclick="closeModal('saveModal')" style="width: 100%; background: #f1f2f6; border-radius: 15px; padding:12px; border:none;">ยกเลิก</button>
    </div>
</div>

<!-- Modal: ย้ายหมวดหมู่ -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--primary); margin: 0 0 20px;">ย้ายหมวดหมู่ 💡</h3>
        <select id="editCatSelect" style="margin-bottom: 30px;"></select>
        <button class="btn-primary" style="width: 100%; margin-bottom: 12px;" onclick="saveEdit()">บันทึกการย้าย</button>
        <button onclick="closeModal('editModal')" style="width: 100%; background: #f1f2f6; border-radius: 15px; padding:12px; border:none;">ยกเลิก</button>
    </div>
</div>

<!-- Modal: ยืนยันการลบ -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <div style="font-size: 3rem; margin-bottom: 10px;">🗑️</div>
        <h3 style="color: var(--danger); margin-bottom: 15px;">ยืนยันการลบ?</h3>
        <p style="font-size:0.9rem; color:#636e72; margin-bottom:30px;">วิดีโอนี้จะถูกลบออกจาก LearnHub ของคุณ</p>
        <button id="confirmDeleteBtn" style="width: 100%; background:var(--danger); color:white; margin-bottom:12px; padding:15px; border-radius:15px; border:none; font-weight:bold;">ลบเลย</button>
        <button onclick="closeModal('deleteModal')" style="width: 100%; background: #f1f2f6; border-radius: 15px; padding:12px; border:none;">ยกเลิก</button>
    </div>
</div>

<script>
    // --- 1. CONFIGURATION ---
    const YT_API_KEY = "AIzaSyBVsxZxnjoMEE6uCk3qaAoenOLEdbgg3U4";
    const firebaseConfig = {
        apiKey: "AIzaSyDWr7Ev6aPzwNPTfuRYp46Pb_a-uJboiXg",
        authDomain: "video-playlist-40cf0.firebaseapp.com",
        projectId: "video-playlist-40cf0",
        storageBucket: "video-playlist-40cf0.firebasestorage.app",
        messagingSenderId: "128728975658",
        appId: "1:128728975658:web:255d64e66af8ef66c57653",
        databaseURL: "https://video-playlist-40cf0-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let myData = { categories: {}, videos: {} };
    let editingVideoKey = null;
    let deletingVideoKey = null;
    let pendingVideoData = { id: '', title: '' };

    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userName').textContent = user.displayName;
            document.getElementById('userImg').src = user.photoURL;
            db.ref('users/' + user.uid).on('value', snapshot => {
                myData = snapshot.val() || { categories: {}, videos: {} };
                updateDropdowns();
                renderVideos();
            });
        } else {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    // --- 2. SEARCH & FETCH ---
    async function searchYouTube() {
        const query = document.getElementById('searchQuery').value.trim();
        if (!query) return;
        const resultsArea = document.getElementById('searchResults');
        resultsArea.innerHTML = "<p style='padding:15px; color:var(--primary);'>✨ กำลังค้นหาบทเรียน...</p>";
        try {
            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${YT_API_KEY}`);
            const data = await res.json();
            resultsArea.innerHTML = "";
            if (data.items) {
                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'result-card';
                    card.innerHTML = `
                        <img src="${item.snippet.thumbnails.medium.url}">
                        <div class="result-title">${item.snippet.title}</div>
                        <button class="btn-primary" style="width:100%; padding:8px; font-size:0.75rem;" 
                            onclick="openSaveModal('${item.id.videoId}', '${item.snippet.title.replace(/'/g, "\\'")}')">บันทึกบทเรียน</button>
                    `;
                    resultsArea.appendChild(card);
                });
            }
        } catch (err) { resultsArea.innerHTML = "Error loading videos"; }
    }

    async function addVideoByUrl() {
        const urlInput = document.getElementById('videoUrl');
        const vid = extractID(urlInput.value);
        if (!vid) return alert("URL ไม่ถูกต้อง");
        try {
            const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${vid}&key=${YT_API_KEY}`);
            const data = await res.json();
            if (data.items && data.items.length > 0) {
                openSaveModal(vid, data.items[0].snippet.title);
                urlInput.value = "";
            } else { alert("ไม่พบวิดีโอ"); }
        } catch (e) { alert("ดึงข้อมูลวิดีโอผิดพลาด"); }
    }

    function extractID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    // --- 3. MODALS & DATA ---
    function openSaveModal(videoId, title) {
        pendingVideoData = { id: videoId, title: title };
        document.getElementById('modalTitleText').textContent = "บันทึก: " + title;
        document.getElementById('modalCatSelect').innerHTML = generateCategoryOptions();
        document.getElementById('saveModal').style.display = 'flex';
    }

    function executeQuickSave() {
        const catId = document.getElementById('modalCatSelect').value;
        if (!catId) return alert("โปรดเลือกหมวดหมู่การเรียนรู้");
        db.ref('users/' + currentUser.uid + '/videos').push().set({
            catId: catId, youtubeId: pendingVideoData.id, title: pendingVideoData.title, addedAt: Date.now()
        }).then(() => closeModal('saveModal'));
    }

    function openDeleteModal(key) {
        deletingVideoKey = key;
        document.getElementById('deleteModal').style.display = 'flex';
    }

    document.getElementById('confirmDeleteBtn').onclick = function() {
        if (deletingVideoKey) {
            db.ref('users/' + currentUser.uid + '/videos/' + deletingVideoKey).remove().then(() => {
                closeModal('deleteModal');
                deletingVideoKey = null;
            });
        }
    };

    function addCategory() {
        const name = document.getElementById('catInput').value.trim();
        const parentId = document.getElementById('parentCatSelect').value;
        if (!name) return;
        db.ref('users/' + currentUser.uid + '/categories').push({
            name: name, parentId: parentId === "none" ? null : parentId
        });
        document.getElementById('catInput').value = '';
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function openEditModal(key, currentCatId) {
        editingVideoKey = key;
        document.getElementById('editCatSelect').innerHTML = generateCategoryOptions();
        document.getElementById('editCatSelect').value = currentCatId;
        document.getElementById('editModal').style.display = 'flex';
    }

    async function saveEdit() {
        const newCatId = document.getElementById('editCatSelect').value;
        const videoRef = db.ref('users/' + currentUser.uid + '/videos/' + editingVideoKey);
        let updateData = { catId: newCatId };
        
        // ถ้าคลิปไหนยังไม่มีชื่อ ให้ดึงชื่อมาอัปเดตให้ใหม่ตอนกดเซฟ
        const currentVideo = myData.videos[editingVideoKey];
        if (!currentVideo.title && currentVideo.youtubeId) {
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${currentVideo.youtubeId}&key=${YT_API_KEY}`);
                const data = await res.json();
                if (data.items && data.items.length > 0) updateData.title = data.items[0].snippet.title;
            } catch(e) {}
        }
        videoRef.update(updateData).then(() => closeModal('editModal'));
    }

    // --- 4. RENDER ENGINE ---
    function generateCategoryOptions() {
        const cats = myData.categories || {};
        const mainCats = []; const subCats = {};
        for (let id in cats) {
            if (!cats[id].parentId) mainCats.push({ id, ...cats[id] });
            else { 
                if (!subCats[cats[id].parentId]) subCats[cats[id].parentId] = []; 
                subCats[cats[id].parentId].push({ id, ...cats[id] }); 
            }
        }
        let html = '<option value="">-- เลือกหมวดหมู่การเรียนรู้ --</option>';
        mainCats.forEach(main => {
            html += `<option value="${main.id}" style="font-weight:bold;">${main.name}</option>`;
            if (subCats[main.id]) subCats[main.id].forEach(sub => { html += `<option value="${sub.id}">&nbsp;&nbsp;&nbsp;└ ${sub.name}</option>`; });
        });
        return html;
    }

    function updateDropdowns() {
        const pSel = document.getElementById('parentCatSelect');
        const fSel = document.getElementById('viewFilter');
        const cats = myData.categories || {};
        let pHTML = '<option value="none">-- เป็นหมวดหลัก --</option>';
        for(let key in cats) if(!cats[key].parentId) pHTML += `<option value="${key}">${cats[key].name}</option>`;
        pSel.innerHTML = pHTML;
        fSel.innerHTML = '<option value="all">💎 คลังความรู้ทั้งหมด</option>' + generateCategoryOptions().replace('-- เลือกหมวดหมู่การเรียนรู้ --', 'กรองตามเนื้อหา');
    }

    function renderVideos() {
        const display = document.getElementById('videoDisplay');
        const filterVal = document.getElementById('viewFilter').value;
        display.innerHTML = '';
        const videos = myData.videos || {};
        const cats = myData.categories || {};
        let allowedIds = [filterVal];
        if (filterVal !== 'all') for (let id in cats) if (cats[id].parentId === filterVal) allowedIds.push(id);

        const sortedKeys = Object.keys(videos).sort((a,b)=>(videos[b].addedAt || 0) - (videos[a].addedAt || 0));
        
        sortedKeys.forEach(key => {
            const v = videos[key];
            if (filterVal !== 'all' && !allowedIds.includes(v.catId)) return;
            const card = document.createElement('div');
            card.className = 'video-card';
            const vTitle = v.title || "📌 คลิกย้ายเพื่ออัปเดตชื่อบทเรียน";
            card.innerHTML = `
                <div class="video-title-tab" title="${vTitle}">${vTitle}</div>
                <div class="iframe-wrap">
                    <iframe src="https://www.youtube-nocookie.com/embed/${v.youtubeId}?modestbranding=1&rel=0&iv_load_policy=3" allowfullscreen></iframe>
                </div>
                <div class="card-actions">
                    <button class="tool-btn" onclick="openEditModal('${key}', '${v.catId}')">✎ ย้าย/อัปเดต</button>
                    <button class="tool-btn" onclick="openDeleteModal('${key}')" style="color:var(--danger);">✖ ลบ</button>
                </div>`;
            display.appendChild(card);
        });
        if (display.innerHTML === '') display.innerHTML = '<p style="text-align:center; color:#bdc3c7; padding:50px;">ยังไม่มีบทเรียนในส่วนนี้ ✨</p>';
    }
</script>
</body>
</html>
